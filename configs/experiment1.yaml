run: "sanity_check"
training:
  model: "iforest" # Isolation Forest
  n_estimators: 100
  max_samples: 256
  contamination: 0.1
  max_features: 1.0
  bootstrap: False
  n_jobs: -1
  random_state: 42

dataset:
  name: ""
  train_split: 0.8
  validation_split: 0.1
  test_split: 0.1
  shuffle: true
  categorical_features: [ "LegacyDevicesExist", "StationaryVsMobile", "SON_status", "ChannelOfOperation", "SuddenDropOfConnection", "RebootPerformedViaCustomer", "StationName", "ExtendedBackhaulRange", "EthernetAndNot1Gig" ]
  discrete_features: [ "NumClientsConnected", "NumAccessPoints", "MeanClientsPerAP", "ChannelSwitches", "NumDevicePowerCycles", "HighSteeringCount", "HomesWithWifiCongestion", "SON_PerClientSteer", "NumIPChanges", "NumNeighborsOnSameChannel", "NumOverallNeighbors", "NumNeighborsOnAdjChannel" ]
  continuous_features: [ "DataUsed_UL", "DataUsed_DL", "Speed_UL", "Speed_DL", "PhyRate", "SignalStrength", "WifiAssociations", "SON_SteerSuccessStatus", "KeyProcessCrashes", "Latency", "HomeWifiScore", "PercentageOfDataOn5G", "ClientBandwidthUsed", "AirtimeCongestion", "ActivePhyRate", "WifiScores_top3Devices" ]

preprocessing:
  imputation_strategy: "mean"
  normalize: true
  transformation: false
  feature_selection: false
  remove_multicollinearity: false
  multicollinearity_threshold: 0.9
